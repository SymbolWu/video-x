<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>video—x · 三端设计评审</title>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body class="review-room">
    <header class="room-head">
      <span class="logo">video<i>—x</i></span
      ><span>产品设计 / 原型评审</span>
    </header>
    <main class="room-main">
      <h1>三端设计原型</h1>
      <div class="room-grid">
        <article>
          <a
            class="design-preview"
            href="concepts/admin.png"
            aria-label="查看管理端完整设计稿"
            ><img
              src="concepts/admin.png"
              alt="录入队列和展开日期控件的资料核对面板"
          /></a>
          <section>
            <h2>管理端 Web</h2>
            <p>选择草稿，核对发行日期并发布到片库。</p>
            <div>
              <a class="try-design" href="admin.html?scene=review"
                >体验资料核对 <span>↗</span></a
              ><a href="admin.html?scene=settings">查看系统设置</a>
            </div>
          </section>
        </article>
        <article>
          <a
            class="design-preview"
            href="concepts/web.png"
            aria-label="查看 Web 观看端完整设计稿"
            ><img
              src="concepts/web.png"
              alt="海报墙上方展开的即时片名搜索和版本提示"
          /></a>
          <section>
            <h2>Web 观看端</h2>
            <p>搜索同名作品，用年份和版本辨认要看的影片。</p>
            <div>
              <a class="try-design" href="index.html?scene=search"
                >体验片库搜索 <span>↗</span></a
              ><a href="index.html">打开发现页</a>
            </div>
          </section>
        </article>
        <article>
          <a
            class="design-preview portrait"
            href="concepts/android.png"
            aria-label="查看安卓观看端完整设计稿"
            ><img
              src="concepts/android.png"
              alt="电影详情上展开的安卓播放版本底部面板"
          /></a>
          <section>
            <h2>安卓观看端</h2>
            <p>对照每个版本的进度，切换或继续上次播放。</p>
            <div>
              <a class="try-design" href="android.html?scene=versions"
                >体验版本选择 <span>↗</span></a
              ><a href="android.html">打开发现页</a>
            </div>
          </section>
        </article>
      </div>
    </main>
  </body>
</html>
