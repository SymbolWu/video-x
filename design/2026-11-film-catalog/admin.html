<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>video—x · 片库 · 管理端</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/admin.css" />
  </head>
  <body class="grain on-paper admin-body">
    <div class="studio">
      <aside class="studio-rail">
        <a class="studio-brand" href="index.html" aria-label="video—x 设计总览">
          video<span>—</span>x <small>管理</small>
        </a>
        <p class="rail-sub">私人媒体库<br /><span>VX · LOCAL</span></p>

        <nav class="rail-nav" aria-label="管理导航" data-rail></nav>

        <footer class="rail-foot">
          <div class="rail-user"><span>VX</span><p>个人媒体库<small>本地管理</small></p></div>
        </footer>
      </aside>

      <div class="studio-main">
        <header class="studio-top">
          <p class="crumb"><span>管理端</span><i>/</i><b data-crumb>录入工作台</b></p>
          <div class="top-actions">
            <div class="theme-picker">
              <button class="theme-trigger" data-act="theme" aria-expanded="false" aria-haspopup="true">
                <span class="theme-dots" data-theme-dots aria-hidden="true"></span>
                <span>主题</span>
                <i aria-hidden="true">⌄</i>
              </button>
              <div class="theme-popover" data-theme-popover hidden>
                <header><div><p class="eyebrow">Appearance</p><h2>主题</h2></div><button data-act="theme-close" aria-label="关闭">×</button></header>
                <div class="theme-list" data-theme-list></div>
                <div class="theme-radius"><span>圆角</span><div data-radius-list></div></div>
                <footer><button data-act="theme-reset">恢复默认</button><small>保存在本机</small></footer>
              </div>
            </div>
            <a class="watch-link" href="web.html">观看端 <span aria-hidden="true">↗</span></a>
            <button class="exit" data-act="logout">退出</button>
          </div>
        </header>

        <main class="studio-content" data-admin-view></main>
      </div>
    </div>

    <div class="overlay-root" data-overlay></div>
    <div class="admin-toast" data-admin-toast role="status" aria-live="polite"></div>

    <script src="scripts/icons.js"></script>
    <script src="scripts/data.js"></script>
    <script src="scripts/admin-data.js"></script>
    <script src="scripts/admin.js"></script>
  </body>
</html>
